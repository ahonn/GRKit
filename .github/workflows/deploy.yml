name: Deploy

# Publishes the site artifact of a tested Release run to Cloudflare Pages.
# Starting this workflow is the approval step, so it deploys the bytes that were tested.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of a successful Release run on main whose device-test package passed
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the Release run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The run ID must be a number."
            exit 1
          fi
          run=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --json workflowName,headBranch,event,conclusion \
            --jq '[.workflowName, .headBranch, .event, .conclusion] | join(" ")')
          echo "Run $RUN_ID: $run"
          if [ "$run" != "Release main workflow_dispatch success" ]; then
            echo "::error::Run $RUN_ID is not a successful Release run on main."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.147.0"
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main
