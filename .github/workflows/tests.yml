name: Tests
on:
  # A pull request runs the tests of a feature branch, so a push runs them only on main.
  push:
    branches: [main]
  pull_request:
  # Release PR starts the tests of the release branch, because its push with the
  # workflow token starts pull request runs that wait for approval.
  workflow_dispatch:
  # The Release workflow checks the commit that it releases.
  workflow_call:
    inputs:
      ref:
        description: Commit to check. The default is the commit of the event.
        type: string
        default: ''
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    env:
      GRKIT_REQUIRE_NATIVE_TESTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install 1.92.0 --profile minimal --component clippy --component rustfmt --target wasm32-unknown-unknown
      - run: rustup default 1.92.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld
      # The ARM builds use the release toolchain. Code sizes depend on the LLVM version,
      # and the Ubuntu default makes a private component exceed its reserved region.
      - if: runner.os == 'Linux'
        name: Install LLVM 21
        env:
          LLVM_KEY_FINGERPRINT: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
        run: |
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | grep --quiet "^fpr:::::::::$LLVM_KEY_FINGERPRINT:"
          sudo gpg --dearmor --output /usr/share/keyrings/llvm.gpg "$RUNNER_TEMP/llvm.asc"
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install --yes clang-21 lld-21
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - run: cargo build -p grkit-wasm --target wasm32-unknown-unknown --release --locked
      - if: runner.os == 'Linux'
        run: GRKIT_CLANG=clang-21 GRKIT_LLD=ld.lld-21 cargo test -p grkit-build --locked -- --ignored synthetic_ dump_
      - run: cargo build --release --locked -p grkit-cli
      - run: target/release/grkit --help
  guides:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install 1.92.0 --profile minimal
      - run: rustup default 1.92.0
      - run: cargo build --locked -p grkit-cli
      - name: Build the installation guides
        run: |
          sh .github/scripts/install-guide-tools.sh "$RUNNER_TEMP/guide-tools"
          sh .github/scripts/build-guides.sh target/debug/grkit "$RUNNER_TEMP/guide-tools" "$RUNNER_TEMP/guides"
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
      - run: rustup default 1.92.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: sh web/scripts/install-wasm-bindgen.sh
      - name: Check and build the web page
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm wasm
          pnpm typecheck
          pnpm test
          pnpm build
  deny:
    runs-on: ubuntu-24.04
    env:
      CARGO_DENY_VERSION: 0.20.2
      CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - run: rustup toolchain install 1.92.0 --profile minimal
      - run: rustup default 1.92.0
      - name: Install cargo-deny
        run: |
          name="cargo-deny-$CARGO_DENY_VERSION-x86_64-unknown-linux-musl"
          curl --fail --location --silent --show-error --retry 3 -o "$RUNNER_TEMP/$name.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$CARGO_DENY_VERSION/$name.tar.gz"
          echo "$CARGO_DENY_SHA256  $RUNNER_TEMP/$name.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$name.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - run: cargo deny --locked check
