name: Site

# Deploys the web page of main when a push changes it. The site keeps the
# runtimes, effects, and guides of the latest published release. The page is
# built from the source of that release with web/ from main, so its WebAssembly
# packager writes packages that the released runtimes accept, and the footer
# shows the released version. If web/ on main needs a packager change that is
# not released yet, the type check fails and the site stays as it is. The page
# loads the packager with a dynamic import, so the Vite build alone does not
# find a missing export. If a camera entry of web/ on main needs a runtime build
# that the release does not have, web/ names an official module that the
# release does not have, or web/ offers a language without guides in the
# release, the run deploys nothing; the release that has it deploys the page.
on:
  push:
    branches: [main]
    paths: ['web/**']
  workflow_dispatch:

permissions:
  contents: read

# A later push builds a newer page, so it replaces a run in progress.
concurrency:
  group: site
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the latest published release
        id: release
        run: |
          set -euo pipefail
          if ! tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null); then
            echo "::notice::No release is published, so there is no site to update."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Each camera entry of web/ on main needs the runtime build of its
          # target in the release. A release without one of them waits: the
          # site stays as it is, and the release that has it deploys web/.
          targets=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/web/src/generated/cameras.ts?ref=$GITHUB_SHA" 2>/dev/null \
            | grep -o "target: '[^']*'" | cut -d "'" -f 2 | sort -u || true)
          # Releases before 1.2.0 name the site site.tar.gz.
          archive="GRKit-${tag#v}-site.tar.gz"
          mkdir -p "$RUNNER_TEMP/release-check"
          if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir "$RUNNER_TEMP/release-check"; then
            archive=site.tar.gz
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir "$RUNNER_TEMP/release-check"
          fi
          released=$(tar -tzf "$RUNNER_TEMP/release-check/$archive" \
            | sed -n 's#^\(\./\)\{0,1\}runtime/\([^/]*\)/build\.json$#\2#p' | sort -u)
          missing=$(comm -23 <(echo "$targets") <(echo "$released") | tr '\n' ' ')
          if [ -n "${missing// /}" ]; then
            echo "::notice::$tag has no runtime for ${missing% }, which web/ of main names. The site stays as it is until a release has it."
            tag=
          fi
          # Each official module of web/ on main needs its module file in the
          # release. Releases before 1.3.0 have no modules/.
          modules=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/web/src/generated/modules.ts?ref=$GITHUB_SHA" 2>/dev/null \
            | grep -o "id: '[A-Z0-9_]*'" | cut -d "'" -f 2 | sort -u || true)
          shipped=$(tar -tzf "$RUNNER_TEMP/release-check/$archive" \
            | sed -n 's#^\(\./\)\{0,1\}modules/\([A-Z0-9_]*\)\.GRM$#\2#p' | sort -u)
          missing=$(comm -23 <(echo "$modules") <(echo "$shipped") | tr '\n' ' ')
          if [ -n "$tag" ] && [ -n "${missing// /}" ]; then
            echo "::notice::$tag has no module ${missing% }, which web/ of main names. The site stays as it is until a release has it."
            tag=
          fi
          # Each language of web/ on main needs its installation guides, and a
          # packager that knows it, in the release.
          languages=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GITHUB_REPOSITORY/contents/web/src/i18n.ts?ref=$GITHUB_SHA" 2>/dev/null \
            | grep -o "{ code: '[A-Za-z-]*'" | cut -d "'" -f 2 | sort -u || true)
          guides=$(tar -tzf "$RUNNER_TEMP/release-check/$archive" \
            | sed -n 's#^\(\./\)\{0,1\}guides/[^/]*/\([A-Za-z-]*\)\.pdf$#\2#p' | sort -u)
          missing=$(comm -23 <(echo "$languages") <(echo "$guides") | tr '\n' ' ')
          if [ -n "$tag" ] && [ -n "${missing// /}" ]; then
            echo "::notice::$tag has no guides in ${missing% }, which web/ of main offers. The site stays as it is until a release has them."
            tag=
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  site:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_URL: ${{ vars.SITE_URL }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Check the settings
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Set the repository variable SITE_URL. See docs/releasing.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Take web/ and the scripts from main
        run: |
          set -euo pipefail
          git fetch --quiet --depth 1 origin "$GITHUB_SHA"
          rm -rf web .github/scripts
          git archive FETCH_HEAD web .github/scripts | tar -x
      - run: rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
      - run: rustup default 1.92.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: sh web/scripts/install-wasm-bindgen.sh
      - name: Build the web page
        working-directory: web
        env:
          PLAUSIBLE_HOST: ${{ vars.PLAUSIBLE_HOST }}
        run: |
          pnpm install --frozen-lockfile
          pnpm wasm
          pnpm typecheck
          pnpm build
      - name: Combine the web page with the site data of the release
        run: |
          set -euo pipefail
          # Releases before 1.2.0 name the site site.tar.gz.
          archive="GRKit-${TAG#v}-site.tar.gz"
          if ! gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir "$RUNNER_TEMP"; then
            archive=site.tar.gz
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir "$RUNNER_TEMP"
          fi
          mkdir "$RUNNER_TEMP/release" "$RUNNER_TEMP/site"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/release"
          # The release writes these directories. The web build writes the rest.
          for data in runtime effects guides; do
            if [ ! -d "$RUNNER_TEMP/release/$data" ]; then
              echo "::error::The site of $TAG has no $data/."
              exit 1
            fi
            cp -R "$RUNNER_TEMP/release/$data" "$RUNNER_TEMP/site/"
          done
          # The official modules. The release job checked that the release has
          # each one that web/ names.
          if [ -d "$RUNNER_TEMP/release/modules" ]; then
            cp -R "$RUNNER_TEMP/release/modules" "$RUNNER_TEMP/site/"
          fi
          for path in web/dist/* web/dist/.[!.]*; do
            [ -e "$path" ] || continue
            if [ -e "$RUNNER_TEMP/site/${path#web/dist/}" ]; then
              echo "::error::The web build and the site data both have ${path#web/dist/}."
              exit 1
            fi
          done
          cp -R web/dist/. "$RUNNER_TEMP/site/"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: site
          path: site-branch
      - name: Commit the site to the site branch
        working-directory: site-branch
        run: |
          set -euo pipefail
          # A release that Deploy published during this run has a newer site.
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [ "$latest" != "$TAG" ]; then
            echo "::error::$latest was published during this run. Start Site again to deploy web/ of main with $latest."
            exit 1
          fi
          sh ../.github/scripts/commit-site.sh "$RUNNER_TEMP/site" "deploy web ${GITHUB_SHA::7} with $TAG"
      - name: Wait until the site serves the web page
        run: |
          set -euo pipefail
          # The entry script name holds a content hash, so it names this build.
          entry=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' web/dist/index.html | head -n 1)
          if [ -z "$entry" ]; then
            echo "::error::web/dist/index.html names no entry script."
            exit 1
          fi
          for attempt in $(seq 90); do
            # grep reads the whole page: `grep -q` stops at the match, and curl then fails to write
            # the rest of the page, which pipefail turns into a failed check.
            if curl --fail --silent --show-error "$SITE_URL/?run=$GITHUB_RUN_ID-$attempt" | grep -F "$entry" > /dev/null; then
              echo "$SITE_URL serves $entry."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL does not serve $entry after 15 minutes. Examine the deployment of the site branch in Cloudflare Pages."
          exit 1
