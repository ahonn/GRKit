name: Release

# Manual release build. It makes the site from the official firmware and uploads it with
# device-test packages. After a device test, the Deploy workflow publishes this run's site.
on:
  workflow_dispatch:
    inputs:
      firmware_source:
        description: Firmware source. "auto" uses the private backup only if the Ricoh download fails.
        type: choice
        options: [auto, backup]
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FIRMWARE_BASE_URL: https://www.ricoh-imaging.co.jp/resources/japan/support/download/digital/FIRMWARE
  GR3_ZIP_SHA256: e895b439e4b3b96ac04f50072f02a63061ec7de5dcc1b070890baa09bc659470
  GR4_ZIP_SHA256: ded47aa6385886e4b1f8f41f8551866ab0f1ecd0aef89934a43ef0e456539e8f
  # A private repository holds the same zips as release assets, one tag for each
  # target. See docs/releasing.md.
  FIRMWARE_BACKUP_REPO: ${{ vars.FIRMWARE_BACKUP_REPO }}
  LLVM_KEY_FINGERPRINT: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
      - run: rustup default 1.92.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: sh web/scripts/install-wasm-bindgen.sh
      - name: Build the web page
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm wasm
          pnpm build
      - name: Install LLVM 21
        run: |
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | grep --quiet "^fpr:::::::::$LLVM_KEY_FINGERPRINT:"
          sudo gpg --dearmor --output /usr/share/keyrings/llvm.gpg "$RUNNER_TEMP/llvm.asc"
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install --yes clang-21 lld-21
      - run: cargo build --release --locked -p grkit-cli
      - run: target/release/grkit doctor --clang clang-21 --lld ld.lld-21
      - name: Build the runtimes and effects from the official firmware
        env:
          FIRMWARE_SOURCE: ${{ inputs.firmware_source }}
          BACKUP_TOKEN: ${{ secrets.FIRMWARE_BACKUP_TOKEN }}
        run: |
          firmware="$RUNNER_TEMP/firmware"
          mkdir "$firmware"
          trap 'rm -rf "$firmware"' EXIT
          # fetch ZIP SHA256 TAG: download an official zip, or its backup, into $firmware.
          fetch() {
            zip="$firmware/$1"
            sum="$2"
            check() { echo "$sum  $zip" | sha256sum --check --strict; }
            if [ "$FIRMWARE_SOURCE" = backup ] \
              || ! curl --fail --location --silent --show-error --retry 3 -o "$zip" "$FIRMWARE_BASE_URL/$1" \
              || ! check; then
              if [ "$FIRMWARE_SOURCE" != backup ]; then
                echo "::warning::The Ricoh download of $1 failed or changed. The build uses the private backup."
              fi
              if [ -z "$FIRMWARE_BACKUP_REPO" ] || [ -z "$BACKUP_TOKEN" ]; then
                echo "::error::No firmware backup is configured."
                exit 1
              fi
              rm -f "$zip"
              GH_TOKEN="$BACKUP_TOKEN" gh release download "$3" \
                --repo "$FIRMWARE_BACKUP_REPO" --pattern "$1" --dir "$firmware"
              check
            fi
          }
          fetch gr3_v210.zip "$GR3_ZIP_SHA256" gr3-2.10
          fetch gr4_v111.zip "$GR4_ZIP_SHA256" gr4-1.11
          unzip -q "$firmware/gr3_v210.zip" fwdc239b.bin -d "$firmware"
          unzip -q "$firmware/gr4_v111.zip" fwdc248b.bin -d "$firmware"
          target/release/grkit build --target gr3-2.10 --firmware "$firmware/fwdc239b.bin" \
            --out "$RUNNER_TEMP/runtime-gr3" --clang clang-21 --lld ld.lld-21
          target/release/grkit build --target gr4-1.11 --firmware "$firmware/fwdc248b.bin" \
            --out "$RUNNER_TEMP/runtime-gr4" --clang clang-21 --lld ld.lld-21
          target/release/grkit site --build "$RUNNER_TEMP/runtime-gr3" --out site
          target/release/grkit site --build "$RUNNER_TEMP/runtime-gr4" --out site
          target/release/grkit effects publish --source effects --firmware "$firmware/fwdc239b.bin" \
            --out site/effects/gr3-2.10
          target/release/grkit effects publish --source effects --target gr4-1.11 \
            --firmware "$firmware/fwdc248b.bin" --out site/effects/gr4-1.11
      - name: Add the web page to the site
        run: |
          for path in web/dist/* web/dist/.[!.]*; do
            [ -e "$path" ] || continue
            if [ -e "site/${path#web/dist/}" ]; then
              echo "::error::The web build and the site data both have ${path#web/dist/}."
              exit 1
            fi
          done
          cp -R web/dist/. site/
      - name: Package the published runtime for device testing
        run: |
          mkdir "$RUNNER_TEMP/no-effects"
          for pair in gr3:gr3-2.10 gr3x:gr3-2.10 gr4:gr4-1.11; do
            camera="${pair%%:*}"
            target/release/grkit package --build "site/runtime/${pair#*:}" --camera "$camera" \
              --effects "$RUNNER_TEMP/no-effects" --out "GRKit-device-test-$camera.zip"
            target/release/grkit verify "GRKit-device-test-$camera.zip"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: site
          if-no-files-found: error
          # Deploy downloads this artifact by run ID. It must run within this period.
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-test
          path: GRKit-device-test-*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Summary
        run: |
          {
            echo "Test the packages of the \`device-test\` artifact on a camera."
            echo "If it passes, start the Deploy workflow with run ID \`$GITHUB_RUN_ID\`."
          } >> "$GITHUB_STEP_SUMMARY"
