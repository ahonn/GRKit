name: Release

# Builds one release from its tag: the site, a package for each camera, the
# firmware dump tool, and a draft GitHub release that holds them. Merging the release pull request tags the merge
# commit and starts this workflow. Then the Deploy workflow publishes the site and
# the release. See docs/releasing.md.
on:
  pull_request:
    types: [closed]
    branches: [main]
  # A pushed tag releases that commit as it is.
  push:
    tags: ['v*']
  # Builds an existing tag again, for example with the firmware backup.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true
      firmware_source:
        description: Firmware source. "auto" uses the private backup only if the Ricoh download fails.
        type: choice
        options: [auto, backup]
        default: auto

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged &&
       github.event.pull_request.head.ref == 'release' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Resolve the release tag
        id: tag
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push)
              tag="$GITHUB_REF_NAME"
              sha="$GITHUB_SHA"
              ;;
            workflow_dispatch)
              tag="$INPUT_TAG"
              sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
              ;;
            pull_request)
              version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
              test -n "$version"
              tag="v$version"
              sha="$MERGE_SHA"
              # A tag that the workflow token creates does not start another run.
              if existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha 2>/dev/null); then
                if [ "$existing" != "$sha" ]; then
                  echo "::error::$tag already points at $existing."
                  exit 1
                fi
              else
                gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" > /dev/null
              fi
              ;;
          esac
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$tag is not a release tag such as v0.1.0."
            exit 1
          fi
          # Release only commits on main.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)
          if [ "$status" != ahead ] && [ "$status" != identical ]; then
            echo "::error::$tag ($sha) is not on main."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  tests:
    needs: tag
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.tag.outputs.sha }}

  build:
    needs: tag
    runs-on: ubuntu-24.04
    env:
      FIRMWARE_BASE_URL: https://www.ricoh-imaging.co.jp/resources/japan/support/download/digital/FIRMWARE
      # A private repository holds the same zips as release assets, one tag for each
      # target. See docs/releasing.md.
      FIRMWARE_BACKUP_REPO: ${{ vars.FIRMWARE_BACKUP_REPO }}
      LLVM_KEY_FINGERPRINT: 6084F3CF814B57C1CF12EFD515CF4D18AF4F7421
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - name: Check that the tag matches the version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml gives version $version, but the tag is $TAG."
            exit 1
          fi
      - run: rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
      - run: rustup default 1.92.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: sh web/scripts/install-wasm-bindgen.sh
      - name: Build the web page
        working-directory: web
        env:
          # Adds Plausible analytics when the variable gives its origin.
          PLAUSIBLE_HOST: ${{ vars.PLAUSIBLE_HOST }}
        run: |
          pnpm install --frozen-lockfile
          pnpm wasm
          pnpm build
      - name: Install LLVM 21
        run: |
          curl --fail --location --silent --show-error -o "$RUNNER_TEMP/llvm.asc" https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --show-keys --with-colons "$RUNNER_TEMP/llvm.asc" | grep --quiet "^fpr:::::::::$LLVM_KEY_FINGERPRINT:"
          sudo gpg --dearmor --output /usr/share/keyrings/llvm.gpg "$RUNNER_TEMP/llvm.asc"
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install --yes clang-21 lld-21
      - run: cargo build --release --locked -p grkit-cli
      - run: target/release/grkit doctor --clang clang-21 --lld ld.lld-21
      - name: Build the runtimes and effects from the official firmware
        env:
          FIRMWARE_SOURCE: ${{ inputs.firmware_source }}
          BACKUP_TOKEN: ${{ secrets.FIRMWARE_BACKUP_TOKEN }}
        run: |
          firmware="$RUNNER_TEMP/firmware"
          mkdir "$firmware"
          trap 'rm -rf "$firmware"' EXIT
          # fetch ZIP SHA256 TAG OFFICIAL: download an official zip, or its backup, into $firmware.
          # A zip that Ricoh does not publish (OFFICIAL false) comes only from the backup.
          fetch() {
            zip="$firmware/$1"
            sum="$2"
            check() { echo "$sum  $zip" | sha256sum --check --strict; }
            if [ "$FIRMWARE_SOURCE" = backup ] || [ "$4" != true ] \
              || ! curl --fail --location --silent --show-error --retry 3 -o "$zip" "$FIRMWARE_BASE_URL/$1" \
              || ! check; then
              if [ "$FIRMWARE_SOURCE" != backup ] && [ "$4" = true ]; then
                echo "::warning::The Ricoh download of $1 failed or changed. The build uses the private backup."
              fi
              if [ -z "$FIRMWARE_BACKUP_REPO" ] || [ -z "$BACKUP_TOKEN" ]; then
                echo "::error::No firmware backup is configured."
                exit 1
              fi
              rm -f "$zip"
              GH_TOKEN="$BACKUP_TOKEN" gh release download "$3" \
                --repo "$FIRMWARE_BACKUP_REPO" --pattern "$1" --dir "$firmware"
              check
            fi
          }
          # `grkit release-plan` lists each runtime build with its firmware download
          # (`grkit_build::target`) and each camera package (`camera.rs`).
          target/release/grkit release-plan > "$RUNNER_TEMP/release-plan.json"
          jq -r '.runtimes[] | [.target, .zip, .zip_sha256, .file, .official] | @tsv' \
            "$RUNNER_TEMP/release-plan.json" > "$RUNNER_TEMP/runtimes.tsv"
          # The loop reads the plan from descriptor 3, so no command in it reads the plan.
          while IFS=$'\t' read -r target archive archive_sum file official <&3; do
            fetch "$archive" "$archive_sum" "$target" "$official"
            # Two GR IV zips hold a firmware file of the same name.
            mkdir "$firmware/$target"
            unzip -q "$firmware/$archive" "$file" -d "$firmware/$target"
            target/release/grkit build --target "$target" --firmware "$firmware/$target/$file" \
              --out "$RUNNER_TEMP/runtime-$target" --clang clang-21 --lld ld.lld-21
            target/release/grkit site --build "$RUNNER_TEMP/runtime-$target" --out site
            target/release/grkit effects publish --source effects --target "$target" \
              --firmware "$firmware/$target/$file" --out "site/effects/$target"
          done 3< "$RUNNER_TEMP/runtimes.tsv"
      - name: Build the official modules
        run: |
          # Each module builds once for every camera and needs no firmware.
          mkdir -p site/modules
          for folder in modules/*/; do
            id=$(target/release/grkit module build --dir "$folder" --out "$RUNNER_TEMP/module.GRM" \
              --objects "$RUNNER_TEMP/module-objects" --clang clang-21 --lld ld.lld-21 | jq -r .id)
            mv "$RUNNER_TEMP/module.GRM" "site/modules/$id.GRM"
            rm -rf "$RUNNER_TEMP/module-objects"
          done
      - name: Build the installation guides
        run: |
          sh .github/scripts/install-guide-tools.sh "$RUNNER_TEMP/guide-tools"
          sh .github/scripts/build-guides.sh target/release/grkit "$RUNNER_TEMP/guide-tools" site/guides
      - name: Add the web page to the site
        run: |
          for path in web/dist/* web/dist/.[!.]*; do
            [ -e "$path" ] || continue
            if [ -e "site/${path#web/dist/}" ]; then
              echo "::error::The web build and the site data both have ${path#web/dist/}."
              exit 1
            fi
          done
          cp -R web/dist/. site/
      # Release assets are GRKit-<version>-<use>. A camera package holds the
      # published runtime, each effect, and each official module, as the site
      # does.
      - name: Package the published runtime for each camera
        run: |
          version="${TAG#v}"
          target/release/grkit effects build --source effects --out "$RUNNER_TEMP/effects"
          # Each camera has one package with the runtime of each of its builds.
          jq -r '.packages[] | [.camera, .name, (.targets | join(" "))] | @tsv' \
            "$RUNNER_TEMP/release-plan.json" > "$RUNNER_TEMP/packages.tsv"
          modules=()
          for module in site/modules/*.GRM; do
            modules+=(--module "$module")
          done
          while IFS=$'\t' read -r camera use targets <&3; do
            builds=()
            for target in $targets; do
              builds+=(--build "site/runtime/$target")
            done
            target/release/grkit package "${builds[@]}" "${modules[@]}" --camera "$camera" \
              --effects "$RUNNER_TEMP/effects" --guide "site/guides/$camera/en.pdf" \
              --out "GRKit-$version-$use.zip"
            target/release/grkit verify "GRKit-$version-$use.zip"
          done 3< "$RUNNER_TEMP/packages.tsv"
      - name: Build the firmware dump tool
        run: target/release/grkit dump --out "GRKit-${TAG#v}-dump.zip" --clang clang-21 --lld ld.lld-21
      - name: Check the version of each runtime
        run: |
          for manifest in site/runtime/*/build.json; do
            if [ "v$(jq -r .version "$manifest")" != "$TAG" ]; then
              echo "::error::$manifest does not give version ${TAG#v}."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          if-no-files-found: error
          # The publish job copies it into the draft release.
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: GRKit-*.zip
          if-no-files-found: error
          retention-days: 3

  # The draft release keeps the tested bytes without an expiry date. Deploy takes
  # the site from it.
  publish:
    needs: [tag, tests, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Create or update the draft release
        run: |
          set -euo pipefail
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$is_draft" != true ]; then
              echo "::error::$TAG is already published. A published release is not replaced."
              exit 1
            fi
          else
            if sh .github/scripts/changelog-section.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"; then
              notes=(--notes-file "$RUNNER_TEMP/notes.md")
            else
              notes=(--generate-notes)
            fi
            gh release create "$TAG" --verify-tag --draft --title "GRKit $TAG" "${notes[@]}"
          fi
          site="$RUNNER_TEMP/GRKit-${TAG#v}-site.tar.gz"
          tar -czf "$site" -C site .
          gh release upload "$TAG" "$site" packages/GRKit-*.zip --clobber
      - name: Summary
        run: echo "The draft release $TAG holds the site, the camera packages, and the dump tool." >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [tag, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
