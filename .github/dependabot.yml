version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Cargo.toml pins wasm-bindgen with `=`. The wasm-bindgen CLI that
      # web/scripts/install-wasm-bindgen.sh installs must be the same version,
      # so update both by hand in one change.
      - dependency-name: wasm-bindgen
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
