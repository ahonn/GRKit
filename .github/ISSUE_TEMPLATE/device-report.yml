name: Device report
description: Report the result of GRKit on a camera, as a pass or a failure.
labels: [device-report]
body:
  - type: markdown
    attributes:
      value: |
        If the camera does not start, read the [recovery guide](https://github.com/ahonn/GRKit/blob/main/resources/RECOVERY.md) first.
        If the problem can damage files or run unexpected code, use the [security policy](https://github.com/ahonn/GRKit/security/policy) instead.
  - type: dropdown
    id: camera
    attributes:
      label: Camera
      options:
        - GR III
        - GR IIIx
        - GR IV
        - GR IV HDF
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version
      placeholder: "2.10"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Package source
      options:
        - Site
        - CLI (grkit package)
    validations:
      required: true
  - type: input
    id: sha256
    attributes:
      label: SHA-256 of GRKit.zip
      description: "macOS and Linux: `shasum -a 256 GRKit.zip`. Windows: `certutil -hashfile GRKit.zip SHA256`."
    validations:
      required: true
  - type: checkboxes
    id: modules
    attributes:
      label: Modules tested
      options:
        - label: Image Control
        - label: Framing
        - label: Guides
        - label: Date Stamp
        - label: Grain
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Pass
        - Fail
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: INSTALL.ERR status
      description: If the card has `SCRIPT/PLUGINS/INSTALL.ERR`, give the number in it.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you did, what you expected, and what occurred. Add photos of the screen if they help.
