# Versions and changelogs come only from change files in .changeset/, never
# from commit messages. Write one with `knope document-change` or by hand, with
# the package that the change affects: `default` (the camera side, CHANGELOG.md)
# or `app` (the phone app, app/CHANGELOG.md).
#
#     ---
#     default: patch
#     ---
#
#     What changed, written for people who use GRKit.
#
# Below 1.0, `major` bumps the minor version and `minor` bumps the patch.
# The Release PR workflow runs `prepare-release`. Merging that PR tags the
# camera release and builds it. The App Build workflow builds the app.
# See docs/releasing.md.

[packages.default]
versioned_files = [
    "Cargo.toml",
    { path = "Cargo.lock", dependency = "grkit-build" },
    { path = "Cargo.lock", dependency = "grkit-cli" },
    { path = "Cargo.lock", dependency = "grkit-core" },
    { path = "Cargo.lock", dependency = "grkit-firmware" },
    { path = "Cargo.lock", dependency = "grkit-protocol" },
    { path = "Cargo.lock", dependency = "grkit-serve" },
    { path = "Cargo.lock", dependency = "grkit-wasm" },
]
changelog = "CHANGELOG.md"

[packages.app]
versioned_files = [
    { path = "app/nsh.json", regex = "\"version\": \"(?<version>\\d+\\.\\d+\\.\\d+)\"" },
    { path = "app/GRKit.xcodeproj/project.pbxproj", regex = "MARKETING_VERSION = (?<version>\\d+\\.\\d+\\.\\d+);" },
]
changelog = "app/CHANGELOG.md"

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"
