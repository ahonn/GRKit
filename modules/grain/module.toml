# Grain: film grain in recorded pictures. In the System style the core
# applies the level of CORE.GRAIN in the native grain stage. In the
# Film-like style the core turns that stage off, and the plane filter of
# grain.c draws the grain of a color negative printed on paper, after the
# grain model of spektrafilm by Andrea Volpato.
id = "GRAIN"
version = 1
order = 50
sources = ["grain.c"]
# Tile n shows value n. Tile 0 is the module tile, for Off at the root.
# Tile 9, the centered and struck symbol, shows the Off row, as for Bloom
# and Halation.
tiles = [
    "tiles/0-module.png",
    "tiles/1-weak.png",
    "tiles/2-medium.png",
    "tiles/3-strong.png",
    "tiles/4-extra.png",
    "tiles/vf-1-weak.png",
    "tiles/vf-2-medium.png",
    "tiles/vf-3-strong.png",
    "tiles/vf-4-extra.png",
    "tiles/off.png",
]
# CORE.GRAIN: 0 Off, 1 weak, 2 medium, 3 strong, 4 extra strong.
# CORE.GRAIN_SIZE: 0 Auto (by ISO), 1 small, 2 medium, 3 large.
uses = ["CORE.GRAIN", "CORE.GRAIN_SIZE"]

# The style of the grain: 0 System, the native grain stage; 1 Film-like,
# the plane filter (grain.c). The core reads it by its state file ID
# (runtime/picture.c: GRAIN_STYLE_ID).
[[settings]]
key = "STYLE"
values = 2
default = 0
saved = true
public = true

# The viewfinder icon: 0 on, 1 off.
[[settings]]
key = "ICON"
values = 2
saved = true
public = true

[page]
setting = "CORE.GRAIN"
off_icon = { tile = 9 }
# The level, the size, the style, then the icon.
settings = ["CORE.GRAIN", "CORE.GRAIN_SIZE", "STYLE", "ICON"]

# The Film-like grain. The core calls it while CORE.GRAIN is not Off, and
# it draws nothing in the System style. It runs before the date (mark).
[[filters]]
apply = "grain_apply"
setting = "CORE.GRAIN"
stage = "frame"

[[indicators]]
id = "grain"
placement = "status_row"
enabled = { all = [{ setting = "CORE.GRAIN", not_equals = 0 }, { setting = "ICON", equals = 0 }] }
# The viewfinder strength icons are tiles 5 to 8. Value 0 maps to tile 4,
# but the indicator is hidden while Grain is Off.
icon = { setting = "CORE.GRAIN", first_tile = 4 }
