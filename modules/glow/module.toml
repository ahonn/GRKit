# Glow: independent Bloom and Halation around recorded highlights.
id = "GLOW"
version = 1
order = 45
sources = ["glow.c", "glow_kernels.c"]
# The module icon, the Off, Weak, Medium, and Strong icons of each effect
# in ADJ (tiles 1 to 8), then the Weak, Medium, and Strong icons of each
# effect in the viewfinder (tiles 9 to 14).
tiles = [
    "tiles/0-module.png",
    "tiles/off-bloom.png",
    "tiles/1-bloom-weak.png",
    "tiles/1-bloom.png",
    "tiles/3-bloom-strong.png",
    "tiles/off-halation.png",
    "tiles/4-halation-weak.png",
    "tiles/2-halation.png",
    "tiles/6-halation-strong.png",
    "tiles/vf-bloom-weak.png",
    "tiles/vf-bloom-medium.png",
    "tiles/vf-bloom-strong.png",
    "tiles/vf-halation-weak.png",
    "tiles/vf-halation-medium.png",
    "tiles/vf-halation-strong.png",
]

# 0 Off, 1 Weak, 2 Medium, 3 Strong.
[[settings]]
key = "BLOOM"
values = 4
saved = true
public = true

[[settings]]
key = "HALATION"
values = 4
saved = true
public = true

# 0 Red, 1 Orange, 2 Gold, 3 White. Monochrome pictures take Orange, and
# GR IV Monochrome does not show the row.
[[settings]]
key = "HALATION_COLOR"
values = 4
default = 1
saved = true
public = true
color_only = true

# The viewfinder icons of Bloom and Halation: 0 on, 1 off.
[[settings]]
key = "BLOOM_ICON"
values = 2
saved = true
public = true

[[settings]]
key = "HALATION_ICON"
values = 2
saved = true
public = true

[page]
kind = "group"

[[page.children]]
key = "BLOOM"
settings = ["BLOOM", "BLOOM_ICON"]
icon = { setting = "BLOOM", first_tile = 1 }

[[page.children]]
key = "HALATION"
settings = ["HALATION", "HALATION_COLOR", "HALATION_ICON"]
icon = { setting = "HALATION", first_tile = 5 }

# Value n shows tile first_tile + n; value 0 does not show.
[[indicators]]
id = "bloom"
placement = "status_row"
enabled = { all = [{ setting = "BLOOM", not_equals = 0 }, { setting = "BLOOM_ICON", equals = 0 }] }
icon = { setting = "BLOOM", first_tile = 8 }

[[indicators]]
id = "halation"
placement = "status_row"
enabled = { all = [{ setting = "HALATION", not_equals = 0 }, { setting = "HALATION_ICON", equals = 0 }] }
icon = { setting = "HALATION", first_tile = 11 }

[[filters]]
apply = "glow_apply"
setting = "BLOOM"
stage = "frame"

[[filters]]
apply = "glow_apply_halation"
setting = "HALATION"
stage = "frame"
