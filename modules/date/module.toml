# Date Imprint: the local time on each recorded picture, as a film data back
# exposes it.
id = "DATE"
version = 1
# The default place in ADJ and in MENU: Film Look, Framing, Guides, Date, Grain.
order = 40
sources = ["stamp.c"]
# Tile n shows style n. Tile 0 is the module tile, for Off at the root.
tiles = [
    "tiles/0-module.png",
    "tiles/1-yy-m-d.png",
    "tiles/2-yy-m-d-time.png",
    "tiles/3-m-d-yy.png",
    "tiles/4-d-m-yy.png",
    "tiles/5-d-m-yy-time.png",
]

# 0 Off, 1 'YY M D, 2 'YY M D H:MM, 3 M D 'YY, 4 D M 'YY, 5 D M 'YY H:MM.
[[settings]]
key = "STYLE"
values = 6
saved = true
public = true

# The digits: 0 classic seven-segment, 1 GR1s dot matrix, 2 GR II.
[[settings]]
key = "LOOK"
values = 3
saved = true
public = true

# Where the date goes on a vertical picture: 0 film (the bottom right of the
# sensor frame, as a film data back prints it), 1 upright (the bottom right of
# the picture turned upright).
[[settings]]
key = "POSITION"
values = 2
saved = true
public = true

# Where the camera has a native settings page, it shows the style, the look,
# and the position.
[page]
setting = "STYLE"
off_row = true
settings = ["STYLE", "LOOK", "POSITION"]
# The Options row in MENU turns each style on or off in ADJ.
options = true

[[filters]]
apply = "date_apply"
setting = "STYLE"
stage = "mark"

[[indicators]]
id = "date"
placement = "status_row"
enabled = { setting = "STYLE", not_equals = 0 }
# The viewfinder shows the format as live-view text: the core label after DATE
# for each STYLE (YMD, YMD HM, MDY, DMY, DMY HM). STYLE 0 maps to DATE, but
# the indicator is hidden while Date Imprint is Off.
icon = { setting = "STYLE", label = "DATE" }
