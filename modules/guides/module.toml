# Guides: composition guides over the still live view.
id = "GUIDES"
version = 1
# The default place in ADJ and in MENU: Film Look, Framing, Guides, Date, Grain.
order = 30
sources = ["guides.c"]
# Tile n shows value n. Tile 0 is the module tile, for Off at the root.
tiles = [
    "tiles/0-module.png",
    "tiles/1-thirds.png",
    "tiles/2-center.png",
    "tiles/3-golden.png",
    "tiles/4-diagonals.png",
    "tiles/5-thirds-center.png",
    "tiles/6-spiral.png",
    "tiles/7-symmetry.png",
]

# 0 Off, 1 thirds, 2 center, 3 golden ratio, 4 diagonals, 5 thirds and center,
# 6 golden spiral, 7 dynamic symmetry. A native settings row has at most 8 values.
[[settings]]
key = "STYLE"
values = 8
saved = true
public = true

# The line color: 0 black as the native grid, 1 white, 2 yellow.
[[settings]]
key = "COLOR"
values = 3
saved = true
public = true

# The line opacity: 0 50% as the native grid, 1 100%.
[[settings]]
key = "OPACITY"
values = 2
saved = true
public = true

# Hide with DISP: 0 On, the guides hide while DISP hides the native information, 1 Off,
# they always show.
[[settings]]
key = "DISP"
values = 2
saved = true
public = true

# The corner where the golden spiral ends, clockwise: 0 top left, 1 top right,
# 2 bottom right, 3 bottom left.
[[settings]]
key = "SPIRAL"
values = 4
default = 2
saved = true
public = true

[page]
setting = "STYLE"
off_row = true
settings = ["STYLE", "COLOR", "OPACITY", "DISP", "SPIRAL"]
# The GRKit section of MENU turns each style on or off for ADJ.
options = true
# Fn on the Golden Spiral row turns the spiral to the next corner, clockwise.
fn_cycle = { value = 6, setting = "SPIRAL" }

# Above the Framing mask (10), below the Framing ratio label (30). The core selects
# one layer from DISP before deciding whether the canvas needs a full clear.
[[layers]]
paint = "guides_paint"
setting = "STYLE"
order = 20
follow_disp = true
enabled = { setting = "DISP", equals = 0 }

[[layers]]
paint = "guides_paint_always"
setting = "STYLE"
order = 20
enabled = { setting = "DISP", equals = 1 }
