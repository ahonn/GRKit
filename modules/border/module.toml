# Border: a white or black border around each recorded picture. The picture
# keeps its size: the whole picture scales down in place and the border fills
# the space around it. Thin is 3% of the picture width at the top and the
# bottom, wide 6%; the sides are wider, as the scale keeps the shape of the
# picture. Off by default.
id = "BORDER"
version = 1
# The default place in ADJ and in MENU: after Glow (45), before Grain (50).
order = 48
sources = ["border.c"]
# Tile n shows style n. Tile 0 is the module tile, for Off at the root. Tile
# 5 is the viewfinder status icon.
tiles = [
    "tiles/0-module.png",
    "tiles/1-white-thin.png",
    "tiles/2-white-wide.png",
    "tiles/3-black-thin.png",
    "tiles/4-black-wide.png",
    "tiles/vf-border.png",
]

# 0 Off, 1 white 3%, 2 white 6%, 3 black 3%, 4 black 6%.
[[settings]]
key = "STYLE"
values = 5
saved = true
public = true

[page]
setting = "STYLE"
off_row = true
# The Options row in MENU turns each style on or off in ADJ.
options = true

# After the marks, so the date is part of the picture: it scales down with
# the picture and stays inside the border, as on a print of a dated film.
[[filters]]
apply = "border_apply"
setting = "STYLE"
stage = "print"

[[indicators]]
id = "border"
placement = "status_row"
enabled = { setting = "STYLE", not_equals = 0 }
icon = { tile = 5 }
