# Framing: a ratio for cropped pictures or composition only. CORE.ASPECT_MODE
# selects the output behavior. The layers show the selected ratio in the
# live view in either mode.
id = "FRAMING"
version = 1
# The default place in ADJ and in MENU: Film Look, Framing, Guides, Date, Grain.
order = 20
sources = ["framing.c"]
# Tile n shows value n. Tile 0 is the module tile, for Off at the root.
tiles = [
    "tiles/0-module.png",
    "tiles/1-xpan.png",
    "tiles/2-16-9.png",
    "tiles/3-4-3.png",
    "tiles/4-2-35.png",
    "tiles/5-1-1.png",
    "tiles/6-5-4.png",
    "tiles/7-7-6.png",
]
uses = ["CORE.ASPECT", "CORE.ASPECT_MODE"]

# The mask outside the framing area: 0 dark (black at 50%), 1 black, 2 frame
# lines only.
[[settings]]
key = "MASK"
values = 3
saved = true
public = true

# The ratio label: 0 on, 1 off.
[[settings]]
key = "LABEL"
values = 2
saved = true
public = true

[page]
setting = "CORE.ASPECT"
off_row = true
settings = ["CORE.ASPECT", "CORE.ASPECT_MODE", "MASK", "LABEL"]
# The GRKit section of MENU turns each ratio on or off for ADJ.
options = true

# The mask stays in each display and shows the selected framing area.
[[layers]]
paint = "framing_mask"
setting = "CORE.ASPECT"
order = 10

# The ratio label shows with the full display, like the top row of native
# settings. It covers the guides that cross it.
[[layers]]
paint = "framing_badge"
setting = "CORE.ASPECT"
order = 30
full_disp = true
live_only = true
