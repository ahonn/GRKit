# Framing: the aspect of still pictures. The page sets CORE.ASPECT, and the
# core crops each ratio from the native 3:2. The layer shows the crop in the
# live view, and the indicator shows its ADJ icon.
id = "FRAMING"
version = 1
# The default place in ADJ and in MENU: Film Look, Framing, Guides, Date, Grain.
order = 20
sources = ["framing.c"]
# Tile n shows value n. Tile 0 is the module tile, for Off at the root.
tiles = [
    "tiles/0-module.png",
    "tiles/1-xpan.png",
    "tiles/2-16-9.png",
    "tiles/3-4-3.png",
    "tiles/4-2-35.png",
    "tiles/5-1-1.png",
    "tiles/6-5-4.png",
    "tiles/7-7-6.png",
]
uses = ["CORE.ASPECT"]

# The mask outside the photo area: 0 dark (black at 50%), 1 black, 2 frame
# lines only.
[[settings]]
key = "MASK"
values = 3
saved = true
public = true

# The viewfinder icon: 0 on, 1 off. Keep LABEL for saved-setting compatibility.
[[settings]]
key = "LABEL"
values = 2
saved = true
public = true

[page]
setting = "CORE.ASPECT"
off_row = true
settings = ["CORE.ASPECT", "MASK", "LABEL"]
# The GRKit section of MENU turns each ratio on or off for ADJ.
options = true

# The mask stays in each display, because it shows the capture area.
[[layers]]
paint = "framing_mask"
setting = "CORE.ASPECT"
order = 10

[[indicators]]
id = "framing"
placement = "status_row"
enabled = { all = [{ setting = "CORE.ASPECT", not_equals = 0 }, { setting = "LABEL", equals = 0 }] }
icon = { setting = "CORE.ASPECT" }
