[workspace]
members = ["crates/grkit-core", "crates/grkit-build", "crates/grkit-cli", "crates/grkit-wasm"]
resolver = "2"

[workspace.package]
version = "1.3.4"
edition = "2021"
rust-version = "1.92"
publish = false
license = "MIT"
repository = "https://github.com/ahonn/grkit"

[workspace.dependencies]
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1"
# The zlib backend that zip already uses, so the PNG reader adds no crates.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
# Module manifests (module.toml) and their text files.
toml = { version = "0.8", default-features = false, features = ["parse"] }
# The site pins wasm-bindgen-cli to this exact version.
wasm-bindgen = "=0.2.128"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
grkit-core = { path = "crates/grkit-core" }
grkit-build = { path = "crates/grkit-build" }

[profile.release]
lto = "thin"
strip = "debuginfo"

# The LUT fit renders hundreds of thousands of colors per import, and its tests run about
# five times slower without optimization.
[profile.dev.package.grkit-core]
opt-level = 2
