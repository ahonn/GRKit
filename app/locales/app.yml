  zh-Hans: "看起来你连接到了其他 Wi‑Fi，请切换到相机的 Wi‑Fi。"
  zh-Hant: "看起來你連線到了其他 Wi‑Fi，請切換到相機的 Wi‑Fi。"
  ja: "別の Wi‑Fi ネットワークに接続されているようです。カメラの Wi‑Fi に切り替えてください。"
  ko: "다른 Wi‑Fi 네트워크에 연결된 것 같습니다. 카메라의 Wi‑Fi로 전환하세요."
