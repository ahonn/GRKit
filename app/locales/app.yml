  zh-Hans: "存储卡空间不足"
  zh-Hant: "記憶卡空間不足"
  ja: "カードの空き容量不足"
  ko: "카드 공간 부족"
error.card_full_body:
  en: "%{size} more is needed. Delete some photos on the camera, then try again."
  zh-Hans: "还需要 %{size}。请在相机上删除一些照片后重试。"
  zh-Hant: "還需要 %{size}。請在相機上刪除一些照片後重試。"
  ja: "あと %{size} 必要です。カメラで写真を削除してから、もう一度お試しください。"
  ko: "%{size}이(가) 더 필요합니다. 카메라에서 사진을 삭제한 후 다시 시도하세요."
error.refused_body:
  en: "The camera didn’t accept this update. Check for updates again."
  zh-Hans: "相机没有接受这次更新。请重新检查更新。"
  zh-Hant: "相機沒有接受這次更新。請重新檢查更新。"
  ja: "カメラはこのアップデートを受け付けませんでした。もう一度アップデートを確認してください。"
  ko: "카메라가 이 업데이트를 받아들이지 않았습니다. 업데이트를 다시 확인하세요."
error.lost_body:
  en: "Reconnect, and the app continues with this update."
  zh-Hans: "重新连接后，应用会接着处理这次更新。"
  zh-Hant: "重新連線後，App 會接著處理這次更新。"
  ja: "再接続すると、アプリがこのアップデートを続行します。"
  ko: "다시 연결하면 앱이 이 업데이트를 이어서 진행합니다."
software.up_to_date:
  en: "GRKit is up to date"
  zh-Hans: "GRKit 已是最新版本"
  zh-Hant: "GRKit 已是最新版本"
  ja: "GRKit は最新です"
  ko: "GRKit이 최신 버전입니다"
software.check_failed:
  en: "Couldn't check for updates"
  zh-Hans: "无法检查更新"
  zh-Hant: "無法檢查更新"
  ja: "アップデートを確認できません"
  ko: "업데이트를 확인할 수 없음"
software.restart_manual:
  en: "Turn the camera off and on, then tap Reconnect."
  zh-Hans: "请把相机关机再开机，然后点按「重新连接」。"
  zh-Hant: "請將相機關機再開機，然後點一下「重新連線」。"
  ja: "カメラの電源を入れ直してから、「再接続」をタップしてください。"
  ko: "카메라를 껐다 켠 후 「다시 연결」을 탭하세요."
