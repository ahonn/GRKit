  ja: "Bluetooth 接続に失敗しました"
  ko: "Bluetooth 연결 실패"
conn.ble_failed.body:
  en: "Turn Bluetooth off and on."
  zh-Hans: "请关闭蓝牙后再打开。"
  zh-Hant: "請關閉藍牙再重新開啟。"
  ja: "Bluetooth をオフにしてから再度オンにしてください。"
  ko: "Bluetooth를 껐다 켜세요."
conn.ble_auth.title:
  en: "Pairing Didn't Complete"
  zh-Hans: "配对未完成"
  zh-Hant: "配對未完成"
  ja: "ペアリングが完了しませんでした"
  ko: "페어링이 완료되지 않음"
conn.ble_auth.body:
  en: "On the camera, select Pairing → Execute Pairing. If it still fails, remove this camera in the phone’s Bluetooth settings first."
  zh-Hans: "请在相机上选择「配对」→「执行配对」。如果仍然失败，请先在手机的蓝牙设置中忽略此相机。"
  zh-Hant: "請在相機上選擇「配對」→「執行配對」。如果仍然失敗，請先在手機的藍牙設定中忘記此相機。"
  ja: "カメラで「ペアリング」→「ペアリング実行」を選択してください。それでも失敗する場合は、先にスマートフォンの Bluetooth 設定でこのカメラの登録を解除してください。"
  ko: "카메라에서 「페어링」 → 「페어링 실행」을 선택하세요. 그래도 실패하면 먼저 휴대폰의 Bluetooth 설정에서 이 카메라를 지우세요."
conn.ble_pair.title:
  en: "Pair on the Camera"
  zh-Hans: "在相机上配对"
  zh-Hant: "在相機上配對"
  ja: "カメラでペアリング"
  ko: "카메라에서 페어링"
conn.ble_pair.body:
  en: "On the camera, select Pairing → Execute Pairing, then tap Try Again."
  zh-Hans: "请在相机上选择「配对」→「执行配对」，然后点按「重试」。"
  zh-Hant: "請在相機上選擇「配對」→「執行配對」，然後點一下「重試」。"
  ja: "カメラで「ペアリング」→「ペアリング実行」を選択してから、「再試行」をタップしてください。"
  ko: "카메라에서 「페어링」 → 「페어링 실행」을 선택한 후 「다시 시도」를 탭하세요."
conn.ble_stale.title:
  en: "Camera Forgot This Device"
  zh-Hans: "相机已不记得此设备"
  zh-Hant: "相機已不記得此裝置"
  ja: "カメラがこの端末を認識していません"
  ko: "카메라가 이 기기를 기억하지 못함"
conn.ble_stale.body:
  en: "In Settings → Bluetooth, tap ⓘ next to this camera and choose Forget This Device. Then pair again on the camera."
  zh-Hans: "请在「设置」→「蓝牙」中点击此相机旁的 ⓘ，选择「忽略此设备」。然后在相机上重新配对。"
  zh-Hant: "請在「設定」→「藍牙」中點一下此相機旁的 ⓘ，選擇「忘記此裝置」。然後在相機上重新配對。"
  ja: "「設定」→「Bluetooth」でこのカメラの横の「ⓘ」をタップし、「このデバイスの登録を解除」を選択してください。その後、カメラでもう一度ペアリングしてください。"
  ko: "설정 → Bluetooth에서 이 카메라 옆의 ⓘ를 탭하고 「이 기기 지우기」를 선택하세요. 그런 다음 카메라에서 다시 페어링하세요."
conn.ble_timeout.title:
  en: "Camera Not Responding"
  zh-Hans: "相机无响应"
  zh-Hant: "相機沒有回應"
  ja: "カメラが応答しません"
  ko: "카메라가 응답하지 않음"
conn.ble_timeout.body:
  en: "Turn the camera on and keep it close by."
  zh-Hans: "请打开相机电源并放在附近。"
  zh-Hant: "請開啟相機電源並放在附近。"
  ja: "カメラの電源を入れて近くに置いてください。"
  ko: "카메라를 켜고 가까이 두세요."
conn.wifi_denied.title:
  en: "Wi‑Fi Join Canceled"
  zh-Hans: "已取消加入 Wi‑Fi"
  zh-Hant: "已取消加入 Wi‑Fi"
  ja: "Wi‑Fi 接続をキャンセルしました"
  ko: "Wi‑Fi 연결 취소됨"
conn.wifi_denied.body:
  en: "Tap Join on the system prompt, or join the camera's Wi‑Fi in Settings › Wi‑Fi."
  zh-Hans: "请在系统提示中点「加入」，或在「设置」→「Wi‑Fi」中加入相机 Wi‑Fi。"
  zh-Hant: "請在系統提示中點選「加入」，或在「設定」→「Wi‑Fi」中加入相機 Wi‑Fi。"
  ja: "システムの確認で「接続」をタップするか、「設定」→「Wi‑Fi」でカメラの Wi‑Fi に接続してください。"
  ko: "시스템 알림에서 「연결」을 탭하거나 설정 → Wi‑Fi에서 카메라 Wi‑Fi에 연결하세요."
conn.wifi_password.title:
  en: "Wrong Wi‑Fi Password"
  zh-Hans: "Wi‑Fi 密码错误"
  zh-Hant: "Wi‑Fi 密碼錯誤"
  ja: "Wi‑Fi パスワードが違います"
  ko: "잘못된 Wi‑Fi 비밀번호"
conn.wifi_password.body:
  en: "The camera's Wi‑Fi password may have changed. Pair on the camera again, then try again."
  zh-Hans: "相机的 Wi‑Fi 密码可能已更改。请在相机上重新配对，然后重试。"
  zh-Hant: "相機的 Wi‑Fi 密碼可能已變更。請在相機上重新配對，然後重試。"
  ja: "カメラの Wi‑Fi パスワードが変更された可能性があります。カメラでもう一度ペアリングしてから、再試行してください。"
  ko: "카메라의 Wi‑Fi 비밀번호가 변경되었을 수 있습니다. 카메라에서 다시 페어링한 후 다시 시도하세요."
conn.wifi_ssid.title:
  en: "Invalid Wi‑Fi Name"
  zh-Hans: "Wi‑Fi 名称无效"
  zh-Hant: "Wi‑Fi 名稱無效"
  ja: "Wi‑Fi 名が無効です"
  ko: "잘못된 Wi‑Fi 이름"
conn.wifi_ssid.body:
  en: "Check the camera's SSID."
  zh-Hans: "请检查相机的 SSID。"
  zh-Hant: "請檢查相機的 SSID。"
  ja: "カメラの SSID を確認してください。"
  ko: "카메라의 SSID를 확인하세요."
conn.wifi_config.title:
  en: "Wi‑Fi Settings Rejected"
  zh-Hans: "Wi‑Fi 设置被拒绝"
  zh-Hant: "Wi‑Fi 設定被拒絕"
  ja: "Wi‑Fi 設定が拒否されました"
  ko: "Wi‑Fi 설정이 거부됨"
conn.wifi_config.body:
  en: "iOS couldn't apply these Wi‑Fi settings. Try again."
  zh-Hans: "iOS 无法应用此 Wi‑Fi 设置，请重试。"
  zh-Hant: "iOS 無法套用此 Wi‑Fi 設定，請重試。"
  ja: "iOS がこの Wi‑Fi 設定を適用できませんでした。もう一度お試しください。"
  ko: "iOS가 이 Wi‑Fi 설정을 적용하지 못했습니다. 다시 시도하세요."
android.conn.wifi_config.body:
  en: "Android couldn't apply these Wi‑Fi settings. Try again."
  zh-Hans: "Android 无法应用此 Wi‑Fi 设置，请重试。"
  zh-Hant: "Android 無法套用此 Wi‑Fi 設定，請重試。"
  ja: "Android がこの Wi‑Fi 設定を適用できませんでした。もう一度お試しください。"
  ko: "Android가 이 Wi‑Fi 설정을 적용하지 못했습니다. 다시 시도하세요."
conn.wifi_failed.title:
  en: "Camera Wi‑Fi Not Ready"
  zh-Hans: "相机 Wi‑Fi 尚未就绪"
  zh-Hant: "相機 Wi‑Fi 尚未就緒"
  ja: "カメラの Wi‑Fi の準備ができていません"
  ko: "카메라 Wi‑Fi가 아직 준비되지 않음"
conn.wifi_failed.body:
  en: "Keep the camera on for a few seconds, then try again."
  zh-Hans: "请保持相机开机几秒钟，然后重试。"
  zh-Hant: "請保持相機開機幾秒鐘，然後重試。"
  ja: "カメラの電源を入れたまま数秒待ってから、もう一度お試しください。"
  ko: "카메라를 켠 채 몇 초 기다린 후 다시 시도하세요."
conn.wifi_timeout.title:
  en: "Camera Wi‑Fi Unreachable"
  zh-Hans: "无法连接相机 Wi‑Fi"
  zh-Hant: "無法連線相機 Wi‑Fi"
  ja: "カメラの Wi‑Fi に接続できません"
  ko: "카메라 Wi‑Fi에 연결할 수 없음"
conn.wifi_timeout.body:
  en: "Make sure the camera is on and its Wi‑Fi is enabled."
  zh-Hans: "请确认相机已开机且 Wi‑Fi 已开启。"
  zh-Hant: "請確認相機已開機且 Wi‑Fi 已開啟。"
  ja: "カメラの電源が入っていて、Wi‑Fi がオンになっているか確認してください。"
  ko: "카메라가 켜져 있고 Wi‑Fi가 활성화되어 있는지 확인하세요."
conn.network_not_ready.title:
  en: "Still Switching to Camera Wi‑Fi"
  zh-Hans: "正在切换到相机 Wi‑Fi"
  zh-Hant: "正在切換到相機 Wi‑Fi"
  ja: "カメラの Wi‑Fi に切り替え中です"
  ko: "카메라 Wi‑Fi로 전환하는 중"
conn.network_not_ready.body:
  en: "Wait a moment, then try again."
  zh-Hans: "请稍等片刻后重试。"
  zh-Hant: "請稍候片刻後重試。"
  ja: "少し待ってから、もう一度お試しください。"
  ko: "잠시 기다린 후 다시 시도하세요."
conn.subnet.title:
  en: "Wi‑Fi Address Conflict"
  zh-Hans: "Wi‑Fi 网段与相机冲突"
  zh-Hant: "Wi‑Fi 網段與相機衝突"
  ja: "Wi‑Fi のアドレスが重複しています"
  ko: "Wi‑Fi 주소 대역이 겹칩니다"
conn.subnet.body:
  en: "Your phone reached your router, not the camera. Turn on Airplane Mode, turn Wi‑Fi back on, then join the camera’s Wi‑Fi."
  zh-Hans: "手机连到了路由器，不是相机。请打开飞行模式，只开 Wi‑Fi，再加入相机 Wi‑Fi。"
  zh-Hant: "手機連到了路由器，不是相機。請開啟飛航模式，只開 Wi‑Fi，再加入相機 Wi‑Fi。"
  ja: "スマートフォンがカメラではなくルーターに接続しています。機内モードをオンにしてから Wi‑Fi だけをオンに戻し、カメラの Wi‑Fi に接続してください。"
  ko: "휴대폰이 카메라 대신 공유기에 연결되었습니다. 에어플레인 모드를 켠 뒤 Wi‑Fi만 다시 켜고 카메라 Wi‑Fi에 연결하세요."
conn.verify.title:
  en: "Camera Not Responding"
  zh-Hans: "相机无响应"
  zh-Hant: "相機沒有回應"
  ja: "カメラが応答しません"
  ko: "카메라가 응답하지 않음"
conn.verify.body:
  en: "Wi‑Fi joined but no reply. Restart the camera."
  zh-Hans: "已加入 Wi‑Fi 但相机无响应，请重启相机。"
  zh-Hant: "已加入 Wi‑Fi 但相機沒有回應，請重新啟動相機。"
  ja: "Wi‑Fi に接続しましたが応答がありません。カメラを再起動してください。"
  ko: "Wi‑Fi에 연결되었지만 응답이 없습니다. 카메라를 재시작하세요."
conn.local_network.title:
  en: "Local Network Access Denied"
  zh-Hans: "本地网络访问被拒绝"
  zh-Hant: "本機網路存取被拒絕"
  ja: "ローカルネットワークへのアクセスが拒否されました"
  ko: "로컬 네트워크 접근 거부됨"
conn.local_network.body:
  en: "GRKit needs Local Network access to talk to your camera. Enable it in Settings → GRKit → Local Network."
  zh-Hans: "GRKit 需要本地网络权限才能与相机通信。请前往「设置」→「GRKit」→「本地网络」开启。"
  zh-Hant: "GRKit 需要本機網路權限才能與相機通訊。請前往「設定」→「GRKit」→「本機網路」開啟。"
  ja: "カメラと通信するには「ローカルネットワーク」の許可が必要です。「設定」→「GRKit」→「ローカルネットワーク」で有効にしてください。"
  ko: "GRKit이 카메라와 통신하려면 로컬 네트워크 접근 권한이 필요합니다. 설정 → GRKit → 로컬 네트워크에서 허용하세요."
android.conn.local_network.body:
  en: "GRKit needs the Nearby devices permission to talk to your camera over Wi‑Fi. Tap Open Settings, then allow it in Permissions → Nearby devices."
  zh-Hans: "GRKit 需要“附近的设备”权限才能通过 Wi‑Fi 与相机通信。请轻点“打开设置”，然后在“权限”→“附近的设备”中允许。"
  zh-Hant: "GRKit 需要「鄰近裝置」權限才能透過 Wi‑Fi 與相機通訊。請輕點「開啟設定」，然後在「權限」→「鄰近裝置」中允許。"
  ja: "Wi‑Fi でカメラと通信するには「付近のデバイス」の権限が必要です。「設定を開く」をタップし、「権限」→「付近のデバイス」で許可してください。"
  ko: "GRKit이 Wi‑Fi로 카메라와 통신하려면 근처 기기 권한이 필요합니다. 「설정 열기」를 탭한 다음 권한 → 근처 기기에서 허용하세요."
conn.not_gr.title:
