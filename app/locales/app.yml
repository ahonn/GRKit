  zh-CN: ".cube 或 LUT 图片"
looks.import_preset:
  en: Lightroom Preset
  zh-CN: Lightroom 预设
looks.import_preset_ext:
  en: ".xmp"
  zh-CN: ".xmp"
looks.import_note:
  en: Your phone converts the file. The camera gets the film look.
  zh-CN: 手机转换文件，相机收到的是胶片风格。
looks.new_title:
  en: "Import LUT"
  zh-CN: "导入 LUT"
looks.replace_title:
  en: Replace Film Look
  zh-CN: 替换胶片风格
looks.send:
  en: "Put on Camera"
  zh-CN: "放到相机上"
looks.sending:
  en: Sending…
  zh-CN: 正在发送…
looks.send_note:
  en: "It is saved on the card of the camera and shows in the camera menu after a restart."
  zh-CN: "保存在相机的卡上，相机重启后出现在菜单中。"
looks.choose_again:
  en: Choose Another File
  zh-CN: 选择其他文件
looks.error.lost_title:
  en: Camera Disconnected
  zh-CN: 相机已断开
looks.error.lost_body:
  en: Reconnect to the camera and try again.
  zh-CN: 请重新连接相机后再试。
looks.error.not_ready_title:
  en: Camera Not Ready
  zh-CN: 相机未就绪
looks.error.not_ready_body:
  en: The card or the camera is busy. Try again in a moment.
  zh-CN: 存储卡或相机正忙，请稍后再试。
looks.error.in_use_title:
  en: Film Look Used by Recipes
  zh-CN: 胶片风格正被配方使用
looks.error.in_use_body:
  en: Change the recipes that use this film look first.
  zh-CN: 请先修改使用这个胶片风格的配方。
looks.error.active_title:
  en: Film Look in Use
  zh-CN: 胶片风格正在使用
looks.error.active_body:
  en: Delete it again to switch the camera to Off.
  zh-CN: 再次删除会让相机切换为关闭。
looks.error.official_title:
  en: Official Film Look
  zh-CN: 官方胶片风格
looks.error.official_body:
  en: Official film looks keep their colors. Only the name and cover can change.
  zh-CN: 官方胶片风格不能修改颜色，只能修改名称和封面。
looks.error.full_title:
  en: No Room on the Camera
  zh-CN: 相机没有空间
looks.error.full_body:
  en: The camera has loaded all the film looks it can. Turn one off first.
  zh-CN: 相机能载入的胶片风格已满，请先关闭一个胶片风格。
looks.error.pending_title:
  en: An Update Is Waiting
  zh-CN: 有等待中的更新
looks.error.pending_body:
  en: Install or cancel it on the camera. Then you can change film looks.
  zh-CN: 在相机上安装或取消它后，才能修改胶片风格。
looks.error.off_title:
  en: Phone Changes Are Off
  zh-CN: 手机修改已关闭
looks.error.off_body:
  en: The camera does not accept changes from the phone now.
  zh-CN: 相机现在不接受手机的修改。
looks.error.busy_title:
  en: Camera Busy
  zh-CN: 相机正忙
looks.error.busy_body:
  en: Another change is running. Try again in a moment.
  zh-CN: 另一项修改正在进行，请稍后再试。
looks.error.camera_title:
  en: Camera Busy
  zh-CN: 相机正忙
looks.error.camera_body:
  en: Close the menu on the camera and go back to the shooting screen. Then try again.
  zh-CN: 请关闭相机上的菜单，回到拍摄画面后再试。
looks.error.restart_title:
  en: Restart the Camera
  zh-CN: 请重启相机
looks.error.restart_body:
  en: The camera lists this film look after it starts again.
  zh-CN: 相机重启后才会列出这个胶片风格。
looks.error.changed_title:
  en: Film Looks Changed
  zh-CN: 胶片风格已变化
looks.error.changed_body:
  en: The film looks changed on the camera. Check them and try again.
  zh-CN: 相机上的胶片风格有变化，请确认后再试。
looks.error.name_title:
  en: Invalid Name
  zh-CN: 名称无效
looks.error.name_body:
  en: Use 1 to 16 English letters, digits or symbols.
  zh-CN: 请使用 1 到 16 个英文字母、数字或符号。
looks.error.gone_title:
  en: Film Look Not Found
  zh-CN: 找不到胶片风格
looks.error.gone_body:
  en: The film look is no longer on the camera.
  zh-CN: 这个胶片风格已不在相机上。
looks.error.cover_title:
  en: Cover Not Saved
  zh-CN: 封面未保存
looks.error.cover_list_body:
  en: The cover list on the card cannot be read or is full. Nothing changed.
  zh-CN: 无法读取存储卡上的封面列表，或列表已满。没有做任何修改。
looks.error.cover_saved_body:
  en: The film look was saved, but its cover was not. Try again.
  zh-CN: 胶片风格已保存，但封面没有保存。请再试一次。
looks.error.import_title:
  en: Cannot Convert the File
  zh-CN: 无法转换文件
looks.error.import_body:
  en: Choose a .cube file, a LUT image, or a Lightroom .xmp preset.
  zh-CN: 请选择 .cube 文件、LUT 图片或 Lightroom .xmp 预设。
looks.error.service_title:
  en: Change Failed
  zh-CN: 修改失败
looks.error.service_body:
  en: The camera refused the change.
  zh-CN: 相机拒绝了这次修改。
looks.add_title:
  en: "Add Film Looks"
  zh-CN: "添加胶片风格"
looks.add_note:
  en: "These film looks are not on the camera. An added film look goes to the card and shows in the camera menu after a restart."
  zh-CN: "这里是还不在相机上的胶片风格。添加的会写到卡上，相机重启后出现在菜单中。"
looks.added_named:
  en: "Take back %{name}"
  zh-CN: "撤回 %{name}"
looks.menu:
  en: "Camera Menu"
  zh-CN: "相机菜单"
looks.menu_note:
  en: "Same order as ADJ on the camera. Touch and hold a film look, then drag it to move it."
  zh-CN: "和相机 ADJ 中的顺序相同。长按胶片风格拖动，调整顺序。"
looks.off_section:
  en: "Off"
  zh-CN: "已关闭"
looks.off_note:
  en: "Film looks that are off stay on the card. The camera menu does not show them."
  zh-CN: "关闭的胶片风格仍在卡上，不在相机菜单中显示。"
looks.hide_named:
  en: "Hide %{name} in the camera menu"
  zh-CN: "在菜单中关闭 %{name}"
looks.show_named:
  en: "Show %{name} in the camera menu"
  zh-CN: "在菜单中开启 %{name}"
looks.restart_one:
  en: "1 change applies after a restart"
  zh-CN: "1 项改动在相机重启后生效"
looks.restart_many:
  en: "%{count} changes apply after a restart"
  zh-CN: "%{count} 项改动在相机重启后生效"
looks.covers_note:
  en: "Official film looks and Cinema looks without a cover of their own use these colors. Color gives colors to color film looks only, and B&W film looks stay gray. Changes apply after a restart."
  zh-CN: "没有单独改过封面的官方胶片风格和 Cinema 用这里的配色：彩色只给彩色胶片风格配色，黑白保持灰色。改动在相机重启后生效。"
looks.menu_place:
  en: "No. %{place}"
  zh-CN: "第 %{place} 个"
looks.official_note:
  en: "Official film looks keep their colors. Their name and cover can change."
  zh-CN: "官方胶片风格的色彩不能修改，名称和封面可以修改。"
looks.import_again:
  en: "Import Another"
  zh-CN: "再导入"
looks.change_file:
  en: "Change"
  zh-CN: "更换"
looks.import_name:
  en: "Film look name"
  zh-CN: "胶片风格名称"
looks.input:
  en: "LUT Input"
  zh-CN: "LUT 输入"
looks.input_auto:
  en: "Auto: %{input}"
  zh-CN: "自动：%{input}"
looks.input_auto_plain:
  en: "Auto"
  zh-CN: "自动"
looks.input_reading:
  en: "Auto: reading the LUT…"
  zh-CN: "自动：正在读取 LUT…"
looks.input_standard:
  en: "Standard: a GR JPEG in Standard"
  zh-CN: "Standard：标准模式的 GR JPEG"
looks.input_srgb:
  en: "sRGB: scene light without a tone curve"
  zh-CN: "sRGB：未加色调曲线的场景光"
looks.input_note:
  en: "The data cannot tell Standard from sRGB, or from a flat look for a camera log. If the LUT was made for sRGB or a log, choose that input."
  zh-CN: "数据无法区分 Standard、sRGB，以及为相机 log 制作的平淡风格。如果 LUT 是为 sRGB 或某种 log 制作的，请选择对应的输入。"
looks.input_log_note:
  en: "GRKit reads V-Log and F-Log only. A LUT for another camera log, such as S-Log3, LogC, C-Log, or N-Log, imports with wrong colors."
  zh-CN: "GRKit 只支持 V-Log 和 F-Log。为其他相机 log（如 S-Log3、LogC、C-Log、N-Log）制作的 LUT，导入后颜色会出错。"
looks.import_fit_note:
  en: "The camera cannot load a LUT. GRKit gets near it with the color controls of the camera, but not exactly. Your phone does the conversion."
  zh-CN: "相机不能直接加载 LUT，GRKit 用相机自带的调色功能去接近它，只能接近，不能完全一致。转换在手机上完成。"
looks.import:
