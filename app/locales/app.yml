  zh-CN: "更新需要在相机上确认，并重启一次相机。胶片风格和设置会保留。"
error.module_title:
  en: "Update with the Memory Card"
  zh-CN: "需要用存储卡更新"
error.module_body:
  en: "This update doesn't have the module %{module} that the camera has. Update GRKit with the memory card."
  zh-CN: "这次更新没有相机上的模块「%{module}」。请用存储卡更新 GRKit。"
error.package_title:
  en: "Can't Prepare the Update"
  zh-CN: "无法准备更新"
error.package_body:
  en: "The files of this update are incomplete. Check for updates again later."
  zh-CN: "这次更新的文件不完整。请稍后再检查更新。"
looks.restart_body:
  en: "Film looks you added, renamed, or gave a new cover show in the menu after a restart."
  zh-CN: "新加、改名和改封面的胶片风格，重启后出现在菜单中。"
