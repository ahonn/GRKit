cam.first_time:
  en: "First connection? On the camera, choose"
  zh-CN: "第一次连接？请先在相机上选择"
  zh-TW: "第一次連線？請先在相機上選擇"
  ja: "初めて接続しますか？先にカメラで選択："
  ko: "처음 연결하나요? 먼저 카메라에서 선택:"
cam.first_time_device:
  en: "First time with this camera? On the camera, choose"
  zh-CN: "第一次连接这台相机？请先在相机上选择"
  zh-TW: "第一次連線這台相機？請先在相機上選擇"
  ja: "このカメラに初めて接続しますか？先にカメラで選択："
  ko: "이 카메라에 처음 연결하나요? 먼저 카메라에서 선택:"
cam.path_common:
  en: "Pairing → Execute Pairing"
  zh-CN: "「配对」→「执行配对」"
  zh-TW: "「配對」→「執行配對」"
  ja: "「ペアリング」→「ペアリング実行」"
  ko: "「페어링」 → 「페어링 실행」"
cam.path_gr3:
  en: "Bluetooth Setting → Pairing → Execute Pairing"
  zh-CN: "「蓝牙设定」→「配对」→「执行配对」"
  zh-TW: "「Bluetooth 設定」→「配對」→「執行配對」"
  ja: "「Bluetooth設定」→「ペアリング」→「ペアリング実行」"
  ko: "「Bluetooth 설정」 → 「페어링」 → 「페어링 실행」"
cam.path_gr4:
  en: "Wireless Communication → Pairing → Execute Pairing"
  zh-CN: "「无线通信设定」→「配对」→「执行配对」"
  zh-TW: "「無線通訊設定」→「配對」→「執行配對」"
  ja: "「無線通信設定」→「ペアリング」→「ペアリング実行」"
  ko: "「무선 통신 설정」 → 「페어링」 → 「페어링 실행」"
cam.step_pair:
  en: "Pairing with camera"
  zh-CN: "正在与相机配对"
  zh-TW: "正在與相機配對"
  ja: "カメラとペアリング中"
  ko: "카메라와 페어링 중"
cam.step_wake:
  en: "Connecting to camera"
  zh-CN: "正在连接相机"
  zh-TW: "正在連線相機"
  ja: "カメラに接続中"
  ko: "카메라에 연결하는 중"
cam.step_wake_sub:
  en: "Waking the camera over Bluetooth."
  zh-CN: "正在通过蓝牙唤醒相机。"
  zh-TW: "正在透過藍牙喚醒相機。"
  ja: "Bluetooth でカメラを起動しています。"
  ko: "Bluetooth로 카메라를 깨우는 중입니다."
cam.step_pair_gr3:
  en: "The camera may show a passkey. Enter it when iOS asks."
  zh-CN: "相机可能会显示配对码，iOS 弹窗出现时输入即可。"
  zh-TW: "相機可能會顯示配對碼，iOS 跳出提示時輸入即可。"
  ja: "カメラにペアリングコードが表示されることがあります。iOS の入力画面が出たら入力してください。"
  ko: "카메라에 페어링 코드가 표시될 수 있습니다. iOS 입력 창이 나타나면 입력해 주세요."
cam.step_pair_gr4:
  en: "The camera may ask to confirm pairing. Accept it on the camera."
  zh-CN: "相机可能会弹出配对确认，请在相机上同意。"
  zh-TW: "相機可能會跳出配對確認，請在相機上同意。"
  ja: "カメラに確認画面が表示されることがあります。カメラ側で承認してください。"
  ko: "카메라에 확인 창이 표시될 수 있습니다. 카메라에서 승인해 주세요."
cam.step_wifi:
  en: "Joining camera Wi‑Fi"
  zh-CN: "正在加入相机 Wi‑Fi"
  zh-TW: "正在加入相機 Wi‑Fi"
  ja: "カメラの Wi‑Fi に接続中"
  ko: "카메라 Wi‑Fi에 연결 중"
cam.step_wifi_sub:
  en: "If iOS asks, allow GRKit to connect to the camera."
  zh-CN: "若 iOS 弹出提示，请允许 GRKit 连接相机。"
  zh-TW: "若 iOS 顯示提示，請允許 GRKit 連接相機。"
  ja: "iOS で確認が表示されたら、GRKit とカメラの接続を許可してください。"
  ko: "iOS에서 요청하면 GRKit의 카메라 연결을 허용해 주세요."
cam.step_wifi_slow:
  en: "GR IV takes longer to start its Wi‑Fi. Please wait."
  zh-CN: "GR IV 启动 Wi‑Fi 需要更长时间，请稍候。"
  zh-TW: "GR IV 啟動 Wi‑Fi 需要更長時間，請稍候。"
  ja: "GR IV は Wi‑Fi の起動に時間がかかります。お待ちください。"
  ko: "GR IV는 Wi‑Fi를 시작하는 데 시간이 더 걸립니다. 잠시 기다려 주세요."
cam.step_verify:
  en: "Contacting the camera"
  zh-CN: "正在与相机通信"
  zh-TW: "正在與相機通訊"
  ja: "カメラと通信中"
  ko: "카메라와 통신하는 중"
cam.step_verify_sub:
  en: "Checking the connection."
  zh-CN: "正在检查连接。"
  zh-TW: "正在檢查連線。"
  ja: "接続を確認しています。"
  ko: "연결을 확인하는 중입니다."
cam.no_grkit_title:
  en: "No GRKit on the Camera"
  zh-CN: "相机上没有 GRKit"
  zh-TW: "相機上沒有 GRKit"
  ja: "カメラに GRKit がありません"
  ko: "카메라에 GRKit이 없음"
cam.no_grkit_body:
  en: "Install GRKit 1.7.0 or later on the memory card."
  zh-CN: "需要在存储卡上安装 GRKit 1.7.0 或更高版本。"
  zh-TW: "需要在記憶卡上安裝 GRKit 1.7.0 或更新版本。"
  ja: "メモリーカードに GRKit 1.7.0 以降をインストールしてください。"
  ko: "메모리 카드에 GRKit 1.7.0 이상을 설치하세요."
cam.install_guide:
  en: "Installation Guide"
  zh-CN: "查看安装说明"
  zh-TW: "查看安裝說明"
  ja: "インストールガイド"
  ko: "설치 안내"
android.cam.step_wifi_sub:
  en: "If Android asks, allow GRKit to connect to the camera."
  zh-CN: "若系统弹出提示，请允许 GRKit 连接相机。"
  zh-TW: "若 Android 顯示提示，請允許 GRKit 連接相機。"
  ja: "Android で確認が表示されたら、GRKit とカメラの接続を許可してください。"
  ko: "Android에서 요청하면 GRKit의 카메라 연결을 허용해 주세요."
android.cam.step_pair_gr3:
  en: "The camera may show a passkey. Enter it when Android asks."
  zh-CN: "相机可能会显示配对码，系统弹窗出现时输入即可。"
  zh-TW: "相機可能會顯示配對碼，Android 跳出提示時輸入即可。"
  ja: "カメラにペアリングコードが表示されることがあります。Android の入力画面が出たら入力してください。"
  ko: "카메라에 페어링 코드가 표시될 수 있습니다. Android 입력 창이 나타나면 입력해 주세요."

update.title:
  en: "Updating %{model}"
  zh-CN: "正在更新 %{model}"
  zh-TW: "正在更新 %{model}"
  ja: "%{model} をアップデート中"
  ko: "%{model} 업데이트 중"
update.step_download:
  en: "Download update"
  zh-CN: "下载更新"
  zh-TW: "下載更新"
  ja: "アップデートをダウンロード"
  ko: "업데이트 다운로드"
update.step_send:
  en: "Send to camera"
  zh-CN: "发送到相机"
  zh-TW: "傳送到相機"
  ja: "カメラに送信"
  ko: "카메라로 전송"
update.step_confirm:
  en: "Confirm on camera"
  zh-CN: "在相机上确认"
  zh-TW: "在相機上確認"
  ja: "カメラで確認"
  ko: "카메라에서 확인"
update.step_restart:
  en: "Restart camera"
  zh-CN: "重启相机"
  zh-TW: "重新啟動相機"
  ja: "カメラを再起動"
  ko: "카메라 재시작"
update.keep_on:
  en: "Keep the camera on and stay in the app."
  zh-CN: "请保持相机开机，不要离开应用。"
  zh-TW: "請保持相機開機，不要離開 App。"
  ja: "カメラの電源を入れたまま、アプリを閉じないでください。"
  ko: "카메라를 켜 두고 앱을 벗어나지 마세요."
update.download_body:
  en: "On the camera's Wi‑Fi, the phone downloads updates over cellular data. Check it and try again."
  zh-CN: "连接相机 Wi‑Fi 时，需要用蜂窝数据下载更新。请检查后重试。"
  zh-TW: "連線相機 Wi‑Fi 時，需要用行動數據下載更新。請檢查後重試。"
  ja: "カメラの Wi‑Fi に接続中は、モバイルデータ通信でアップデートをダウンロードします。確認してもう一度お試しください。"
  ko: "카메라 Wi‑Fi에 연결된 동안에는 모바일 데이터로 업데이트를 다운로드합니다. 확인한 후 다시 시도하세요."
update.cancel:
  en: "Cancel Update"
  zh-CN: "取消更新"
  zh-TW: "取消更新"
  ja: "アップデートをキャンセル"
  ko: "업데이트 취소"
update.cancel_title:
  en: "Cancel the Update?"
  zh-CN: "取消更新？"
  zh-TW: "取消更新？"
  ja: "アップデートをキャンセルしますか？"
  ko: "업데이트를 취소할까요?"
update.cancel_body_send:
  en: "What was sent is removed from the camera."
  zh-CN: "已发送的部分会从相机上删除。"
  zh-TW: "已傳送的部分會從相機上刪除。"
  ja: "送信済みのデータはカメラから削除されます。"
  ko: "전송된 데이터는 카메라에서 삭제됩니다."
update.cancel_body_confirm:
  en: "The update waiting on the camera is removed."
  zh-CN: "相机上待确认的更新会被删除。"
  zh-TW: "相機上待確認的更新會被刪除。"
  ja: "カメラで確認待ちのアップデートは削除されます。"
  ko: "카메라에서 확인을 기다리는 업데이트가 삭제됩니다."
update.cancel_body_restart:
  en: "The camera won't install this update when it restarts."
  zh-CN: "相机重启后不会安装这次更新。"
  zh-TW: "相機重新啟動後不會安裝這次更新。"
  ja: "カメラを再起動しても、このアップデートはインストールされません。"
  ko: "카메라를 재시작해도 이 업데이트는 설치되지 않습니다."
update.cancel_keep:
  en: "Keep Updating"
  zh-CN: "继续更新"
  zh-TW: "繼續更新"
  ja: "アップデートを続ける"
  ko: "업데이트 계속"
update.cancel_confirm:
  en: "Cancel Update"
  zh-CN: "取消更新"
  zh-TW: "取消更新"
  ja: "アップデートをキャンセル"
  ko: "업데이트 취소"
update.reconnect:
  en: "Reconnect"
  zh-CN: "重新连接"
  zh-TW: "重新連線"
  ja: "再接続"
  ko: "다시 연결"
update.ok:
  en: "OK"
  zh-CN: "好"
  zh-TW: "好"
  ja: "OK"
  ko: "확인"
update.menu_value:
  en: "Update %{version}"
  zh-CN: "更新 %{version}"
  zh-TW: "更新 %{version}"
  ja: "アップデート %{version}"
  ko: "업데이트 %{version}"
update.updated_toast:
  en: "GRKit updated to %{version}"
  zh-CN: "GRKit 已更新到 %{version}"
  zh-TW: "GRKit 已更新到 %{version}"
  ja: "GRKit を %{version} にアップデートしました"
  ko: "GRKit을 %{version}(으)로 업데이트했습니다"
update.failed_title:
  en: "Update Didn't Finish"
  zh-CN: "更新没有完成"
  zh-TW: "更新沒有完成"
  ja: "アップデートが完了しませんでした"
  ko: "업데이트가 완료되지 않음"
update.failed_sub:
  en: "The camera started without finishing the install, so GRKit isn't running."
  zh-CN: "相机开机时没有完成安装，GRKit 没有运行。"
  zh-TW: "相機開機時沒有完成安裝，GRKit 沒有執行。"
  ja: "インストールが完了しないままカメラが起動したため、GRKit は動作していません。"
  ko: "설치가 끝나지 않은 채 카메라가 시작되어 GRKit이 실행되지 않습니다."
update.failed_body:
  en: "Restart the camera once more. If GRKit still doesn't start, put the card in a computer and install GRKit again at grkit.app."
  zh-CN: "请再重启一次相机。如果还是这样，把存储卡插到电脑上，在 grkit.app 重新安装。"
  zh-TW: "請再重新啟動一次相機。如果還是這樣，把記憶卡插到電腦上，在 grkit.app 重新安裝。"
  ja: "カメラをもう一度再起動してください。それでも GRKit が起動しない場合は、メモリーカードをコンピューターに挿入し、grkit.app で GRKit をインストールし直してください。"
  ko: "카메라를 한 번 더 재시작하세요. 그래도 GRKit이 시작되지 않으면 메모리 카드를 컴퓨터에 넣고 grkit.app에서 GRKit을 다시 설치하세요."
update.open_site:
  en: "Open grkit.app"
  zh-CN: "打开 grkit.app"
  zh-TW: "開啟 grkit.app"
  ja: "grkit.app を開く"
  ko: "grkit.app 열기"
restart.running_title:
  en: "Restarting the Camera"
  zh-CN: "正在重启相机"
  zh-TW: "正在重新啟動相機"
  ja: "カメラを再起動中"
  ko: "카메라 재시작 중"
restart.running_body:
  en: "Don't turn off the camera or leave the app."
  zh-CN: "请不要关闭相机或离开应用。"
  zh-TW: "請不要關閉相機或離開 App。"
  ja: "カメラの電源を切ったり、アプリを閉じたりしないでください。"
  ko: "카메라를 끄거나 앱을 벗어나지 마세요."
restart.manual_body:
  en: "Turn the camera off and on, then tap Reconnect."
  zh-CN: "请把相机关机再开机，然后点按「重新连接」。"
  zh-TW: "請將相機關機再開機，然後點一下「重新連線」。"
  ja: "カメラの電源を入れ直してから、「再接続」をタップしてください。"
  ko: "카메라를 껐다 켠 후 「다시 연결」을 탭하세요."
restart.auto_body:
  en: "The app turns the camera off and on, then checks the version."
  zh-CN: "应用会先关闭相机再打开，然后检查版本。"
  zh-TW: "App 會先關閉相機再開啟，然後檢查版本。"
  ja: "アプリがカメラの電源を入れ直し、バージョンを確認します。"
  ko: "앱이 카메라를 껐다 켠 후 버전을 확인합니다."
restart.run:
  en: "Restart Camera"
  zh-CN: "重启相机"
  zh-TW: "重新啟動相機"
  ja: "カメラを再起動"
  ko: "카메라 재시작"
restart.title:
  en: "Restart the Camera"
  zh-CN: "重启相机"
  zh-TW: "重新啟動相機"
  ja: "カメラを再起動"
  ko: "카메라 재시작"
restart.subtitle:
  en: "The update is confirmed. It installs when the camera restarts."
  zh-CN: "更新已确认，重启一次相机就会安装。"
  zh-TW: "更新已確認，重新啟動一次相機就會安裝。"
  ja: "アップデートを確認しました。カメラを再起動するとインストールされます。"
  ko: "업데이트가 확인되었습니다. 카메라를 재시작하면 설치됩니다."
confirm.subtitle:
  en: "The update is on the camera and waits for you."
  zh-CN: "更新已在相机上，等你确认。"
  zh-TW: "更新已在相機上，等你確認。"
  ja: "アップデートはカメラに届いています。確認してください。"
  ko: "업데이트가 카메라에 있습니다. 확인해 주세요."
confirm.step1:
  en: "Press ADJ and move to GRK"
  zh-CN: "按 ADJ，移到「GRK」"
  zh-TW: "按 ADJ，移到「GRK」"
  ja: "ADJ を押して「GRK」に移動"
  ko: "ADJ를 누르고 「GRK」로 이동"
confirm.step2:
  en: "Choose MOD, then %{update}"
  zh-CN: "选择「MOD」，再选择「%{update}」"
  zh-TW: "選擇「MOD」，再選擇「%{update}」"
  ja: "「MOD」を選び、「%{update}」を選択"
  ko: "「MOD」를 선택한 뒤 「%{update}」 선택"
confirm.step3:
  en: "Choose Execute"
  zh-CN: "选择「执行」"
  zh-TW: "選擇「執行」"
  ja: "「実行」を選択"
  ko: "「실행」 선택"
confirm.waiting:
  en: "Waiting · %{time} left"
  zh-CN: "等待确认 · 剩余 %{time}"
  zh-TW: "等待確認 · 剩餘 %{time}"
  ja: "確認待ち · 残り %{time}"
  ko: "확인 대기 · %{time} 남음"
installed.verified:
  en: "The camera is running the new version."
  zh-CN: "相机正在运行新版本。"
  zh-TW: "相機正在執行新版本。"
  ja: "カメラは新しいバージョンで動作しています。"
  ko: "카메라가 새 버전으로 실행 중입니다."
error.download_title:
  en: "Couldn't Download the Update"
  zh-CN: "无法下载更新"
  zh-TW: "無法下載更新"
  ja: "アップデートをダウンロードできません"
  ko: "업데이트를 다운로드할 수 없음"
error.card_full_title:
  en: "Card Is Full"
  zh-CN: "存储卡空间不足"
  zh-TW: "記憶卡空間不足"
  ja: "カードの空き容量不足"
  ko: "카드 공간 부족"
error.card_full_body:
  en: "%{size} more is needed. Delete some photos on the camera, then try again."
  zh-CN: "还需要 %{size}。请在相机上删除一些照片后重试。"
  zh-TW: "還需要 %{size}。請在相機上刪除一些照片後重試。"
  ja: "あと %{size} 必要です。カメラで写真を削除してから、もう一度お試しください。"
  ko: "%{size}이(가) 더 필요합니다. 카메라에서 사진을 삭제한 후 다시 시도하세요."
error.not_confirmed_title:
  en: "Not Confirmed on the Camera"
  zh-CN: "未在相机上确认"
  zh-TW: "未在相機上確認"
  ja: "カメラで確認されませんでした"
  ko: "카메라에서 확인되지 않음"
error.not_confirmed_body:
  en: "No confirmation within 5 minutes, so the camera removed this update."
  zh-CN: "5 分钟内没有确认，相机已删除这次更新。"
  zh-TW: "5 分鐘內沒有確認，相機已刪除這次更新。"
  ja: "5 分以内に確認がなかったため、カメラはこのアップデートを削除しました。"
  ko: "5분 안에 확인되지 않아 카메라가 이 업데이트를 삭제했습니다."
error.refused_body:
  en: "This update doesn't fit the firmware of this camera."
