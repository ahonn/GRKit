android.error.bt_body:
  en: "Turn on Bluetooth and allow Nearby devices for GRKit. On Android 11 or earlier, allow Location and turn it on."
  zh-Hans: "请打开蓝牙，并允许 GRKit 使用「附近的设备」。Android 11 及更早版本需允许位置权限并打开定位服务。"
  zh-Hant: "請開啟藍牙，並允許 GRKit 使用「鄰近裝置」。Android 11 及更早版本需允許位置權限並開啟定位服務。"
  ja: "Bluetooth をオンにし、GRKit に「付近のデバイス」を許可してください。Android 11 以前は「位置情報」を許可してオンにしてください。"
  ko: "Bluetooth를 켜고 GRKit에 근처 기기 권한을 허용하세요. Android 11 이하는 위치 권한을 허용하고 위치를 켜세요."
android.error.wifi_body:
  en: "Choose the camera in the network prompt and allow Nearby devices for GRKit. On Android 12 or earlier, allow Location and turn it on."
  zh-Hans: "请在网络提示中选择相机，并允许 GRKit 使用「附近的设备」。Android 12 及更早版本需允许位置权限并打开定位服务。"
  zh-Hant: "請在網路提示中選擇相機，並允許 GRKit 使用「鄰近裝置」。Android 12 及更早版本需允許位置權限並開啟定位服務。"
  ja: "ネットワーク確認でカメラを選択し、GRKit に「付近のデバイス」を許可してください。Android 12 以前は「位置情報」を許可してオンにしてください。"
  ko: "네트워크 알림에서 카메라를 선택하고 GRKit에 근처 기기 권한을 허용하세요. Android 12 이하는 위치 권한을 허용하고 위치를 켜세요."

