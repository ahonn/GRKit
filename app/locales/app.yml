android.connecting.wifi_sub:
  en: Choose the camera in the Android network prompt. Stay connected even without internet.
  zh-CN: 请在 Android 网络提示中选择相机。即使没有互联网，也请保持连接。
  zh-TW: "請在 Android 網路提示中選擇相機。即使沒有網際網路，也請保持連線。"
  ja: "Android のネットワーク確認でカメラを選択してください。インターネットに接続できなくても、接続を維持してください。"
  ko: "Android 네트워크 알림에서 카메라를 선택하세요. 인터넷이 없어도 연결을 유지하세요."
android.error.bt_body:
  en: Turn on Bluetooth. In Android Settings, allow Nearby devices for GRKit on Android 12 or later. On Android 11 or earlier, allow Location and turn on Location services.
  zh-CN: 请打开蓝牙。在 Android 设置中，Android 12 及更新版本需允许 GRKit 使用“附近的设备”；Android 11 及更早版本需允许位置权限，并打开定位服务。
  zh-TW: "請開啟藍牙。在 Android 設定中，Android 12 及更新版本需允許 GRKit 使用「鄰近裝置」；Android 11 及更早版本需允許位置權限，並開啟定位服務。"
  ja: "Bluetooth をオンにしてください。Android の設定で、Android 12 以降は GRKit に「付近のデバイス」を許可します。Android 11 以前は「位置情報」を許可し、位置情報サービスをオンにします。"
  ko: "Bluetooth를 켜세요. Android 설정에서 Android 12 이상은 GRKit에 근처 기기 권한을 허용하세요. Android 11 이하는 위치 권한을 허용하고 위치 서비스를 켜세요."
android.error.wifi_body:
  en: Select the camera in the network prompt. On Android 13 or later, allow Nearby devices for GRKit. On Android 12 or earlier, allow Location and turn on Location services.
  zh-CN: 请在网络提示中选择相机。Android 13 及更新版本需允许 GRKit 使用“附近的设备”；Android 12 及更早版本需允许位置权限，并打开定位服务。
  zh-TW: "請在網路提示中選擇相機。Android 13 及更新版本需允許 GRKit 使用「鄰近裝置」；Android 12 及更早版本需允許位置權限，並開啟定位服務。"
  ja: "ネットワーク確認でカメラを選択してください。Android 13 以降は GRKit に「付近のデバイス」を許可します。Android 12 以前は「位置情報」を許可し、位置情報サービスをオンにします。"
  ko: "네트워크 알림에서 카메라를 선택하세요. Android 13 이상은 GRKit에 근처 기기 권한을 허용하세요. Android 12 이하는 위치 권한을 허용하고 위치 서비스를 켜세요."

