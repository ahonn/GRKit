looks.save:
  en: Save
  zh-CN: 保存
looks.import_title:
  en: Import a Film Look
  zh-CN: 导入胶片风格
looks.import_body:
  en: Make a film look from a file on your phone.
  zh-CN: 用手机上的文件制作胶片风格。
looks.import_lut:
  en: LUT File
  zh-CN: LUT 文件
looks.import_lut_ext:
