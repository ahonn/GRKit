  zh-CN: 请重新连接相机后再试。
looks.error.not_ready_title:
  en: Camera Not Ready
  zh-CN: 相机未就绪
looks.error.not_ready_body:
  en: The card or the camera is busy. Try again in a moment.
  zh-CN: 存储卡或相机正忙，请稍后再试。
looks.error.in_use_title:
  en: Film Look Used by Recipes
  zh-CN: 胶片风格正被配方使用
looks.error.in_use_body:
  en: Change the recipes that use this film look first.
  zh-CN: 请先修改使用这个胶片风格的配方。
looks.error.active_title:
  en: Film Look in Use
  zh-CN: 胶片风格正在使用
looks.error.active_body:
  en: Delete it again to switch the camera to Off.
  zh-CN: 再次删除会让相机切换为关闭。
looks.error.official_title:
  en: Official Film Look
  zh-CN: 官方胶片风格
looks.error.official_body:
  en: Official film looks keep their colors. Only the name and cover can change.
  zh-CN: 官方胶片风格不能修改颜色，只能修改名称和封面。
looks.error.pending_title:
  en: An Update Is Waiting
  zh-CN: 有等待中的更新
looks.error.pending_body:
  en: Install or cancel it on the camera. Then you can change film looks.
  zh-CN: 在相机上安装或取消它后，才能修改胶片风格。
looks.error.off_title:
  en: Phone Changes Are Off
  zh-CN: 手机修改已关闭
looks.error.off_body:
  en: The camera does not accept changes from the phone now.
  zh-CN: 相机现在不接受手机的修改。
looks.error.busy_title:
  en: Camera Busy
  zh-CN: 相机正忙
looks.error.busy_body:
  en: Another change is running. Try again in a moment.
  zh-CN: 另一项修改正在进行，请稍后再试。
looks.error.camera_title:
  en: Camera Busy
  zh-CN: 相机正忙
looks.error.camera_body:
  en: Close the GRKit page on the camera, then try again.
  zh-CN: 请关闭相机上的 GRKit 页面后再试。
looks.error.restart_title:
  en: Restart the Camera
  zh-CN: 请重启相机
looks.error.restart_body:
  en: The camera lists this film look after it starts again.
  zh-CN: 相机重启后才会列出这个胶片风格。
looks.error.changed_title:
  en: Film Looks Changed
  zh-CN: 胶片风格已变化
looks.error.changed_body:
  en: The film looks changed on the camera. Check them and try again.
  zh-CN: 相机上的胶片风格有变化，请确认后再试。
looks.error.name_title:
  en: Invalid Name
  zh-CN: 名称无效
looks.error.name_body:
  en: Use 1 to 16 English letters, digits or symbols.
  zh-CN: 请使用 1 到 16 个英文字母、数字或符号。
looks.error.gone_title:
  en: Film Look Not Found
  zh-CN: 找不到胶片风格
looks.error.gone_body:
  en: The film look is no longer on the camera.
  zh-CN: 这个胶片风格已不在相机上。
looks.error.cover_title:
  en: Cover Not Saved
  zh-CN: 封面未保存
looks.error.cover_list_body:
  en: The cover list on the card cannot be read or is full. Nothing changed.
  zh-CN: 无法读取存储卡上的封面列表，或列表已满。没有做任何修改。
looks.error.cover_saved_body:
  en: The film look was saved, but its cover was not. Try again.
  zh-CN: 胶片风格已保存，但封面没有保存。请再试一次。
looks.error.import_title:
  en: Cannot Convert the File
  zh-CN: 无法转换文件
looks.error.import_body:
  en: Choose a .cube file, a LUT image, or a Lightroom .xmp preset.
  zh-CN: 请选择 .cube 文件、LUT 图片或 Lightroom .xmp 预设。
