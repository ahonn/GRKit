android.conn.wifi_denied.body:
  en: "Tap Open Settings and allow Nearby devices for GRKit. On Android 12 or earlier, allow Location."
  zh-Hans: "请点「打开设置」，允许 GRKit 使用「附近的设备」。Android 12 及更早版本需允许位置权限。"
  zh-Hant: "請點一下「開啟設定」，允許 GRKit 使用「鄰近裝置」。Android 12 及更早版本需允許位置權限。"
  ja: "「設定を開く」をタップし、GRKit に「付近のデバイス」を許可してください。Android 12 以前は「位置情報」を許可してください。"
  ko: "「설정 열기」를 탭하고 GRKit에 근처 기기 권한을 허용하세요. Android 12 이하는 위치 권한을 허용하세요."
android.conn.wifi_failed.body:
  en: "Keep the camera on, then try again and accept the Wi‑Fi request when Android asks."
  zh-Hans: "请保持相机开机，然后重试，并在 Android 请求连接 Wi‑Fi 时同意。"
  zh-Hant: "請保持相機開機，然後重試，並在 Android 要求連線 Wi‑Fi 時同意。"
  ja: "カメラの電源を入れたまま、もう一度お試しください。Android で Wi‑Fi への接続を求められたら許可してください。"
  ko: "카메라를 켠 채 다시 시도하고, Android에서 Wi‑Fi 연결을 요청하면 허용하세요."
